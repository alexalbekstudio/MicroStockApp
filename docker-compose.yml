services:
  db:
    image: postgres:16-alpine
    container_name: microstock_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: microstock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d microstock"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: microstock_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/microstock
      SECRET_KEY: standalone-production-secret-key
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups
      - ./static/img:/app/static/img

volumes:
  pgdata: